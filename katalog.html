<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Katalog Paket</title><link rel="stylesheet" href="style.css">
<style>.row{background:rgba(255,255,255,.5);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.row b{display:block}.row small{color:#3b4a70}.row code{font-size:.75rem;word-break:break-all}
.cp{border:0;border-radius:10px;padding:8px 12px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}</style></head>
<body><div class="bg"><i class="orb o1"></i><i class="orb o2"></i></div>
<main class="card"><h1>Katalog Paket</h1><p class="sub">Semua alamat paket link. Salin dan bagikan.</p><div class="list" id="l"></div></main>
<script src="links.js"></script>
<script>
var G=SITE_CONFIG,base=location.origin+location.pathname.replace(/katalog\.html$/,"");
Object.keys(G.paket).forEach(function(k){var u=base+"?k="+k,r=document.createElement("div");r.className="row";
r.innerHTML='<div><b></b><small></small><br><code></code></div><button class="cp">Salin</button>';
r.querySelector("b").textContent=k+(k===G.bawaan?" (alamat utama)":"");
r.querySelector("small").textContent=G.paket[k].catatan||"";r.querySelector("code").textContent=u;
r.querySelector("button").onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(u);this.textContent="Tersalin ✓"};
document.getElementById("l").appendChild(r)});
</script></body></html>
